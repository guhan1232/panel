# CNB 流水线：
# 1) main push：后端 vet/test/build + 前端构建（质量门）
# 2) $ tag_push（panel-v* tag，如 panel-v0.41.1）：构建两架构服务端二进制（ldflags 注入版本）
#    -> 发布 panel-release Release（含 upgrade-manifest.json）-> 面板「设置 -> 系统运维 -> 面板在线升级」自动检查/升级
main:
  push:
    - name: backend-test
      runner:
        cpus: 4
      docker:
        image: golang:1.26
      stages:
        - name: vet
          script: go vet ./...
        - name: test
          script: go test ./...
        - name: build
          script: CGO_ENABLED=0 go build ./...
    - name: frontend-build
      runner:
        cpus: 4
      docker:
        image: node:22-alpine
      stages:
        - name: build
          script: cd web && npm ci --no-audit --no-fund && npm run build

$:
  tag_push:
    - name: panel-server
      runner:
        cpus: 4
      docker:
        image: golang:1.26
      stages:
        - name: build-server
          script: |
            VER=$(echo "$CNB_BRANCH" | sed -n 's/^panel-v//p')
            if [ -z "$VER" ]; then echo "skip: not panel-v* tag"; exit 0; fi
            echo "version: $VER"
            cd "$CNB_BUILD_WORKSPACE"
            REPO=$(find "$(pwd)" -maxdepth 3 -name go.mod | head -1 | xargs dirname)
            echo "repo: $REPO"
            cd "$REPO"
            LDFLAGS="-s -w -X cnb.cool/hanyuxin/panel/internal/core.Version=$VER"
            mkdir -p dist
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/hanyuxin-linux-amd64 ./cmd/server
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/hanyuxin-linux-arm64 ./cmd/server
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/hanyuxin-agent-linux-amd64 ./cmd/agent
            A64=$(sha256sum dist/hanyuxin-linux-amd64 | awk '{print $1}')
            ARM=$(sha256sum dist/hanyuxin-linux-arm64 | awk '{print $1}')
            printf '{\n  "version": "%s",\n  "notes": "%s",\n  "arch": {\n    "amd64": { "url": "https://cnb.cool/%s/-/releases/download/panel-release/hanyuxin-linux-amd64", "sha256": "%s" },\n    "arm64": { "url": "https://cnb.cool/%s/-/releases/download/panel-release/hanyuxin-linux-arm64", "sha256": "%s" }\n  }\n}\n' "$VER" "hanyuxin-panel $VER (CNB cloud build)" "$CNB_REPO_SLUG" "$A64" "$CNB_REPO_SLUG" "$ARM" > dist/upgrade-manifest.json
            cat dist/upgrade-manifest.json
            ls -lh dist/
        - name: create-release
          type: git:release
          options:
            tag: panel-release
            title: hanyuxin-panel server (official build by CNB)
            description: panel server binaries (amd64/arm64) + agent + upgrade-manifest.json. Panel "Settings -> Panel Upgrade" checks and applies automatically.
            latest: false
        - name: upload-assets
          script: |
            # ensure panel-release Release exists (git:release under tag_push may attach to the event tag)
            curl -s -o /dev/null -w "ensure:%{http_code}\n" -X POST \
              -H "Authorization: Bearer $CNB_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" \
              -d '{"tag_name":"panel-release","name":"hanyuxin-panel server","body":"server binaries"}' \
              "$CNB_API_ENDPOINT/$CNB_REPO_SLUG/-/releases" || true
            cd dist
            for F in hanyuxin-linux-amd64 hanyuxin-linux-arm64 hanyuxin-agent-linux-amd64 upgrade-manifest.json; do
              SIZE=$(stat -c%s "$F")
              REL=$(curl -sf -H "Authorization: Bearer $CNB_TOKEN" -H "Accept: application/json" "$CNB_API_ENDPOINT/$CNB_REPO_SLUG/-/releases/tags/panel-release")
              REL_ID=$(echo "$REL" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
              UP=$(curl -sf -X POST -H "Authorization: Bearer $CNB_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" \
                -d "{\"asset_name\":\"$F\",\"size\":$SIZE,\"overwrite\":true}" \
                "$CNB_API_ENDPOINT/$CNB_REPO_SLUG/-/releases/$REL_ID/asset-upload-url")
              UPLOAD_URL=$(echo "$UP" | grep -o '"upload_url":"[^"]*"' | cut -d'"' -f4)
              VERIFY_URL=$(echo "$UP" | grep -o '"verify_url":"[^"]*"' | cut -d'"' -f4)
              curl -sf -X PUT -T "$F" "$UPLOAD_URL" && curl -sf -X POST -H "Authorization: Bearer $CNB_TOKEN" -H "Accept: application/json" "$VERIFY_URL" \
                && echo "OK $F" || { echo "FAIL $F"; exit 1; }
            done
